version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: jerry-mongodb
    volumes:
      - jerry-db-data:/data/db
    networks:
      - jerry-network

  node-server:
    build:
      context: ./_original_node_ref
    container_name: jerry-node-server
    environment:
      - PORT=3000
    networks:
      - jerry-network
    expose:
      - "3000"
    restart: always

  python-backend:
    build:
      context: ./backend
    container_name: jerry-python-backend
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=jerry
      - JWT_SECRET=${JWT_SECRET:-supersecret}
      - DEFAULT_NODE_SERVER_URL=http://node-server:3000
    depends_on:
      - mongodb
    networks:
      - jerry-network
    expose:
      - "8000"
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: jerry-frontend
    networks:
      - jerry-network
    ports:
      - "80:80"
    depends_on:
      - python-backend
    restart: always

networks:
  jerry-network:
    driver: bridge

volumes:
  jerry-db-data:
