version: '3.8'

services:
  node-server:
    build:
      context: ./_original_node_ref
    container_name: jerry-node-server
    environment:
      - PORT=3000
    networks:
      - jerry-network
    expose:
      - "3000"
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: jerry-frontend
    networks:
      - jerry-network
    ports:
      - "5000:80"
    restart: always

networks:
  jerry-network:
    driver: bridge
