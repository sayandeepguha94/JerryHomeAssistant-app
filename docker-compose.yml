version: '3.8'

services:
  jerry-app:
    build:
      context: .
      dockerfile: _original_node_ref/Dockerfile
    container_name: jerry-home-assistant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=3000
      - NODE_ENV=production
      # - GEMINI_API_KEY=your_key_here
    ports:
      - "3000:3000"
    restart: always
